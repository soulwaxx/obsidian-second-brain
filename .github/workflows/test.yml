name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install system prerequisites (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git jq shellcheck
      - name: Install system prerequisites (macOS)
        if: runner.os == 'macOS'
        run: brew install jq shellcheck
      - name: Install Python prerequisites
        run: python -m pip install --requirement .github/requirements-ci.txt
      - name: Validate workflows
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
          # renovate: datasource=github-releases depName=rhysd/actionlint
          ACTIONLINT_VERSION: v1.7.12
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          gh release download "$ACTIONLINT_VERSION" --repo rhysd/actionlint \
            --pattern '*_linux_amd64.tar.gz' --pattern '*_checksums.txt' --dir "$work"
          (
            cd "$work"
            sha256sum --check --ignore-missing ./*_checksums.txt
            tar -xzf ./*_linux_amd64.tar.gz actionlint
          )
          "$work/actionlint" -color
      - name: Shell checks
        run: |
          bash -n hooks/obsidian-session.sh tests/install-smoke.sh
          shellcheck tests/install-smoke.sh
      - name: Verify locked publishing tools
        if: runner.os == 'Linux'
        run: |
          npm ci --prefix .github/release-tools --ignore-scripts --no-fund
          node .github/release-tools/check.mjs
          npm audit --prefix .github/release-tools --audit-level=critical
      - name: Release configuration checks
        run: npm run release:check && npm run test:release
      - name: Source tests
        run: npm test
      - name: Packed runtime tests
        run: npm run test:package
      - name: Install agent CLIs
        env:
          # renovate: datasource=npm depName=@earendil-works/pi-coding-agent
          PI_VERSION: '1.0.0'
          # renovate: datasource=npm depName=@anthropic-ai/claude-code
          CLAUDE_VERSION: '2.1.288'
        run: npm install --global "@earendil-works/pi-coding-agent@$PI_VERSION" "@anthropic-ai/claude-code@$CLAUDE_VERSION"
      - name: Validate plugin and isolated installation
        run: |
          claude plugin validate .
          bash tests/install-smoke.sh

  ci:
    name: CI passed
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record tested source identity
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/release-source.mjs record "$RUNNER_TEMP/evidence/source.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: verified-source-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/source.json
          if-no-files-found: error
          retention-days: 30
