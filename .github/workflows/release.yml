name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Recover missing outputs for an existing stable vX.Y.Z tag'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'soulwaxx/obsidian-second-brain' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require successful PR CI for the exact merged tree
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RECOVERY_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            SOURCE_SHA=$(node scripts/release-recovery.mjs resolve "$RECOVERY_TAG")
          fi
          node scripts/release-source.mjs verify "$SOURCE_SHA"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  release:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install artifact-check prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          python -m pip install --requirement .github/requirements-ci.txt
      - name: Refuse a superseded main update
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"
      - name: Install publishing CLI
        env:
          # renovate: datasource=npm depName=npm
          NPM_VERSION: '11.21.0'
        run: npm install --global "npm@$NPM_VERSION"
      - name: Install agent CLIs for prepared-artifact checks
        env:
          # renovate: datasource=npm depName=@earendil-works/pi-coding-agent
          PI_VERSION: '1.0.0'
          # renovate: datasource=npm depName=@anthropic-ai/claude-code
          CLAUDE_VERSION: '2.1.288'
        run: npm install --global "@earendil-works/pi-coding-agent@$PI_VERSION" "@anthropic-ai/claude-code@$CLAUDE_VERSION"
      - name: Install and verify locked release tools
        run: |
          npm ci --prefix .github/release-tools --ignore-scripts --no-fund
          node .github/release-tools/check.mjs
          npm audit --prefix .github/release-tools --audit-level=critical
      - name: Publish version, tag, GitHub Release, and npm package
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: .github/release-tools/node_modules/.bin/semantic-release
      - name: Recover missing publication outputs
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_TAG: ${{ inputs.tag }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: node scripts/release-recovery.mjs recover "$RECOVERY_TAG"
